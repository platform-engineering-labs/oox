name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: "."
          - dir: "provx"
            # Pin the toolchain to the module's declared floor and forbid
            # auto-upgrades, proving the floor actually compiles.
            go-version: "1.26.0"
            gotoolchain: "local"
          - dir: "gcpname"
            # Same reason as provx, and it matters more here: this module
            # exists partly so consumers pinning an older Go can take it, and
            # the only thing that proves the floor is building at the floor.
            go-version: "1.26.0"
            gotoolchain: "local"
          - dir: "cmd/oox"
    env:
      GOTOOLCHAIN: ${{ matrix.gotoolchain || 'auto' }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.dir }}/go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- '*.mod' '*.sum'
